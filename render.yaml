# Click-to-deploy on Render.com: New + > Blueprint > pick this repo.
# Check the "plan" names against Render's current pricing page before you deploy.
services:
  - type: web
    name: whiteboard
    runtime: docker
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: whiteboard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: WEB_CONCURRENCY
        value: "4"
databases:
  - name: whiteboard-db
    plan: basic-1gb
