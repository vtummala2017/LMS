# Self-hosting option: 3 small containers (app, database, HTTPS).
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: whiteboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: whiteboard
    command: postgres -c max_connections=100 -c shared_buffers=512MB
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whiteboard"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: always
    environment:
      DATABASE_URL: postgresql://whiteboard:${POSTGRES_PASSWORD}@db:5432/whiteboard
      SECRET_KEY: ${SECRET_KEY}
      COOKIE_SECURE: "1"
    depends_on:
      db: {condition: service_healthy}
  https:
    image: caddy:2-alpine
    restart: always
    command: caddy reverse-proxy --from ${DOMAIN} --to app:8000
    ports: ["80:80", "443:443"]
    volumes: [caddy:/data]
    depends_on: [app]
volumes:
  pgdata:
  caddy:
